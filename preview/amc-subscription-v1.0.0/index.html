<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AMC-Subscription v1.0.0</title>
  <style>
    html, body, iframe { width: 100%; height: 100%; margin: 0; border: 0; overflow: hidden; }
    body { background: #f5f7fb; }
    iframe { visibility: hidden; }
  </style>
</head>
<body>
  <iframe id="amcPreview" src="source.html" title="AMC-Subscription v1.0.0"></iframe>
  <script>
    document.getElementById("amcPreview").addEventListener("load", function () {
      const frameDocument = this.contentDocument;
      const meta = frameDocument.createElement("meta");
      meta.name = "amc-version-manifest";
      meta.content = "../../manifests/amc-subscription-v1.0.0.json";
      frameDocument.head.append(meta);
      const runtime = frameDocument.createElement("script");
      runtime.src = "../../version-runtime.js?v=20261030-2";
      runtime.addEventListener("load", async () => {
        try {
          await frameDocument.defaultView.AMC_VERSION_MANIFEST_READY;
          frameDocument.defaultView.showAppPage?.("reports");
        } finally {
          this.style.visibility = "visible";
        }
      });
      frameDocument.body.append(runtime);
    });
  </script>
</body>
</html>
